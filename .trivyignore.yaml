# Trivy findings accepted on purpose, each with its reason (make test-infra and CI read this file).
misconfigurations:
  - id: AZU-0013
    paths:
      - "infra/modules/key-vault/main.tf"
      - "modules/key-vault/main.tf"
    statement: >-
      Public network access with Entra authentication and RBAC on each secret: the platform, the KEDA scaler and the
      deployer read the vault without a virtual network. PRIVATE_NETWORKING adds a private endpoint (docs/DECISIONS.md, D21).
  - id: AZU-0016
    paths:
      - "infra/modules/key-vault/main.tf"
      - "modules/key-vault/main.tf"
    statement: >-
      No purge protection: azd down followed by azd provision must reuse the vault's name. The vault holds only the
      GitHub Apps' keys, which are regenerated in GitHub if lost.
  - id: DS-0031
    paths:
      - "runner/Dockerfile"
    statement: >-
      MICROSOFT_KEY_FINGERPRINT is the public fingerprint of Microsoft's package signing key, not a secret.
  - id: AZU-0012
    paths:
      - "infra/modules/storage-account/main.tf"
    statement: >-
      The queue watchdog's host storage (deployment package and Functions host state, no data): its Flex Consumption
      app has no virtual network integration, so it reaches the account's public endpoint. Shared keys are disabled:
      only Entra identities with a role on the account get in (docs/DECISIONS.md, D26).
  - id: AZU-0057
    paths:
      - "infra/modules/storage-account/main.tf"
    statement: >-
      Classic storage logging is not used: the account holds only the watchdog's package and host state.
  - id: AZU-0061
    paths:
      - "infra/modules/storage-account/main.tf"
    statement: >-
      Service-level encryption (Microsoft-managed keys) is enough for a deployment package and host state; the module
      is shared and stays as it is.
