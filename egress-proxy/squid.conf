# The runners' egress proxy (docs/DECISIONS.md, D20): HTTPS to port 443 and plain HTTP to port 80, only for the domains
# of allowlist.txt; every other request is denied and logged. No cache and no TLS interception: the proxy sees host
# names and ports, never content. Only the virtual network reaches it (an internal Container Apps environment).

http_port 3128
# No pid file: the container runs one Squid as the proxy user, which can't write to /run.
pid_filename none

# -n: match the host name as requested, never a reverse lookup, so an IP address in a request matches no domain.
acl allowed_domains dstdomain -n "/etc/squid/allowlist.txt"
acl https_port port 443
acl http_port port 80
acl CONNECT method CONNECT

http_access deny CONNECT !https_port
http_access deny !CONNECT !http_port
http_access allow allowed_domains
http_access deny all

cache deny all
forwarded_for delete
# No ICMP in a container: Squid's pinger only logs errors there.
pinger_enable off

# One line per request: time, client, result/status, method, host:port (HTTPS) or URL (HTTP), bytes. The image's
# entrypoint copies access.log to the container's output, so the lines reach Log Analytics (docs/OPERATIONS.md).
logformat egress %{%Y-%m-%dT%H:%M:%S}tl %>a %Ss/%03>Hs %rm %ru %<st
access_log daemon:/var/log/squid/access.log egress
