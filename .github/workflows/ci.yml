# Checks of this repository, on GitHub-hosted runners (free for a public repository). Never on the self-hosted
# runners: they serve a private repository only (docs/DECISIONS.md, D8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint (shellcheck, hadolint)
        run: make lint CONTAINER=docker
      - name: Build the image, start its tools, run the entrypoint's tests
        run: make test CONTAINER=docker
      - name: Build the egress proxy image, check its allowlist through it
        run: make test-proxy CONTAINER=docker

  queue-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: The watchdog's unit tests
        run: make test-watchdog

  infra:
    # Offline only: no Azure sign-in, no backend and no plan, so no identifier of the deployment reaches the public logs
    # (docs/DECISIONS.md, D22). Plans and applies run from the maintainer's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Format, validation, tflint, Trivy, and the tests with mock providers
        env:
          GITHUB_TOKEN: ${{ github.token }}  # tflint downloads its azurerm rules from GitHub
        run: make test-infra
