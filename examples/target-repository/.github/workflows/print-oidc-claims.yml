# Copy into the private repository the runners serve. Prints the claims of a GitHub OIDC token for the azure-dev
# environment (never the token), so that the deployer identity's federated credential uses the exact subject.
name: OIDC token claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: aca-agent
    timeout-minutes: 5
    environment: azure-dev
    steps:
      - name: Claims of an OIDC token for Azure
        run: |
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while ((${#payload} % 4)); do payload+="="; done
          base64 -d <<<"$payload" | jq '{sub, aud, iss, repository, repository_id, repository_owner_id, environment, ref}'
