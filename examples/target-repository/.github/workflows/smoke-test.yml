# Copy into the private repository the runners serve. Runs one job on an ephemeral runner and shows what it is.
# It also signs in to Azure through GitHub OIDC, as the deployer identity, without any secret.
name: Smoke test of the ephemeral runners

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # the OIDC token for the Azure sign-in

jobs:
  smoke-test:
    # A JIT runner carries only the labels it was registered with (no self-hosted, Linux, X64): docs/DECISIONS.md D9.
    runs-on: aca-agent
    timeout-minutes: 10
    # The deployer identity trusts this environment's tokens; its variables hold the identity's client ID, the
    # tenant and the subscription (not secrets).
    environment: azure-dev
    steps:
      - name: Runner
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS, $RUNNER_ARCH)"
          echo "Tools: $(az version --query '"azure-cli"' -o tsv) / $(gh --version | head -1) / node $(node --version)"
      - name: No identity variable reaches the steps
        run: |
          if env | grep -E '^(IDENTITY_|MSI_|KV_SECRET|AZURE_CLIENT_ID_RUNTIME|GH_REGISTRAR)'; then
            echo "::error::a sensitive variable reached the job"
            exit 1
          fi
          echo "None of the entrypoint's sensitive variables is set."
      - name: The managed identity endpoint gives nothing without its header
        # On Azure Container Apps the identity endpoint is http://localhost:12356/msi/token; it needs the header that
        # the entrypoint cleared. With the image's passwordless sudo, look for that header in every process too.
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            "http://localhost:12356/msi/token?resource=https://vault.azure.net&api-version=2019-08-01" || true)
          echo "Identity endpoint without the header: HTTP ${status:-no answer}"
          holders=$(sudo grep -l -a IDENTITY_HEADER /proc/[0-9]*/environ 2>/dev/null || true)
          echo "Processes whose environment holds the header: ${holders:-none}"
          if [[ "$status" == 200 || -n "$holders" ]]; then
            echo "::error::a job step can get a token for the runtime identity"
            exit 1
          fi
      - name: OIDC token claims (the claims only, never the token)
        run: |
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while ((${#payload} % 4)); do payload+="="; done
          base64 -d <<<"$payload" | jq '{sub, aud, iss, repository, environment, ref}'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Signed in to Azure without a secret
        run: |
          az account show --query "{subscription: name, signedInAs: user.type}" --output table
